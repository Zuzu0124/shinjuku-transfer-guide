<title>신주쿠역 京王線 → 山手線 환승 가이드</title>
<style>
:root{--jr:#9acd32;--jr2:#6ba225;--ko:#df0058;--ink:#18181b}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Noto Sans JP',system-ui,sans-serif;background:#f4f4f0;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none}.app{height:100dvh;max-width:440px;margin:auto;background:white;display:flex;flex-direction:column;box-shadow:0 20px 60px #0002;position:relative}.top{padding:calc(env(safe-area-inset-top) + 12px) 16px 0;border-bottom:1px solid #e7e5e4}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.mini{font-size:9px;letter-spacing:.28em;color:#78716c;font-weight:800}.title{font-size:14px;font-weight:900;margin-top:3px}.chips{display:flex;align-items:center;gap:7px;font-weight:900}.chip{font-size:11px;color:white;border-radius:999px;padding:3px 9px}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;position:relative}.tab{border:0;background:transparent;padding:8px 4px 12px;font-weight:900;color:#a8a29e}.tab b{display:block;font-size:28px;line-height:1}.tab.active{color:#18181b}.line{position:absolute;bottom:0;left:0;width:50%;height:3px;background:#18181b;transition:.25s}.stage{flex:1;position:relative;overflow:hidden;background-image:radial-gradient(#0001 1px,transparent 1px);background-size:14px 14px}.photo{height:66%;background:#18181b;position:relative}.photo img{width:100%;height:100%;object-fit:cover;display:block}.count{position:absolute;right:14px;top:14px;background:#18181bdd;color:white;border-radius:99px;padding:6px 12px;font-weight:900}.start,.goal{position:absolute;left:16px;top:16px;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:900}.start{background:#fbbf24;color:#78350f}.goal{background:white;color:var(--jr2);border:2px solid var(--jr)}.copy{height:34%;background:white;border-top:2px solid #f5f5f4;padding:17px 16px;display:flex;gap:14px}.icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;font-weight:900;flex:none;border:2px solid #0001}.meta{font-size:11px;letter-spacing:.18em;font-weight:900;color:#2563eb}.jp{font-weight:900;font-size:16px;margin:6px 0}.ko{font-size:15px;line-height:1.5;color:#57534e}.ko mark{background:linear-gradient(transparent 55%,#ffe74c 55%);font-weight:900}.foot{padding:13px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid #e7e5e4}.row{display:flex;justify-content:space-between;align-items:end}.step{font-weight:900}.step b{font-size:32px}.time{text-align:right;font-size:11px;font-weight:900;color:#78716c}.time b{display:block;color:#18181b;font-size:20px}.progress{height:8px;border-radius:99px;background:#e7e5e4;overflow:hidden;margin:10px 0 12px}.progress div{height:100%;background:linear-gradient(90deg,var(--jr),var(--jr2));transition:.25s}.nav{display:grid;grid-template-columns:2fr 3fr;gap:8px}.nav button{border:0;border-radius:16px;padding:15px 8px;font-weight:900;font-size:15px}.prev{background:#f5f5f4;color:#44403c}.next{background:#18181b;color:white}.hint{text-align:center;color:#a8a29e;font-size:10px;margin-top:9px}.reset{position:absolute;right:18px;bottom:132px;width:48px;height:48px;border-radius:50%;border:1px solid #e7e5e4;background:white;box-shadow:0 8px 25px #0002;font-size:20px}.routeB .line{transform:translateX(100%)}
</style>
</head>
<body><div class="app" id="app"><header class="top"><div class="bar"><div><div class="mini">SHINJUKU TRANSFER</div><div class="title">京王線 → 山手線 (이케부쿠로 방면)</div></div><div class="chips"><span class="chip" style="background:var(--ko)">KO</span><span>→</span><span class="chip" style="background:var(--jr)">JR</span></div></div><div class="tabs"><button class="tab active" data-route="A"><b>1</b>1번선 도착</button><button class="tab" data-route="B"><b>2·3</b>2·3번선 도착</button><div class="line"></div></div></header><main class="stage" id="stage"></main><footer class="foot"><div class="row"><div class="step"><b id="cur">1</b> / <span id="total">14</span> <span style="font-size:11px;color:#78716c;margin-left:8px">STEP</span></div><div class="time">소요 시간 <b id="duration">2:10</b></div></div><div class="progress"><div id="prog"></div></div><div class="nav"><button class="prev" id="prev">← 이전</button><button class="next" id="next">다음 →</button></div><div class="hint">← 좌우 스와이프로도 전환 →</div></footer><button class="reset" id="reset">↻</button></div><script>
const I={start:['▶','#FEF3C7','#B45309','乗車位置'],walk:['↑','#F4F4F5','#3F3F46','直進'],left:['↰','#DBEAFE','#1D4ED8','左折'],rightBack:['↱','#DBEAFE','#1D4ED8','右斜め後ろ'],rightFront:['↗','#DBEAFE','#1D4ED8','右斜め前'],gate:['▣','#ECFCCB','#6BA225','改札'],stairsUp:['⇧','#FFEDD5','#C2410C','階段↑'],stairsDown:['⇩','#FFEDD5','#C2410C','階段↓'],goal:['◎','#ECFCCB','#6BA225','到着']};
const A=[['start','乗車位置','8량 편성은 <mark>5호차 3번 문</mark>, 10량 편성은 <mark>7호차 3번 문</mark>으로 타기','sjklya-1.jpg'],['walk','エスカレーター','내린 후 눈앞의 <mark>에스컬레이터</mark>를 타고 올라가기','sjklya-2.jpg'],['rightBack','右斜め後ろへ','올라가자마자 <mark>오른쪽 뒤편</mark>으로 돌아 약 15초 직진','sjklya-3.jpg'],['walk','突き当たりの改札','끝까지 가면 개찰구가 보임','sjklya-4.jpg'],['gate','JRのりかえ改札','「<mark>← JRのりかえ</mark>」라고 적힌 초록색 개찰구로 나가기','sjklya-5.jpg'],['left','左へ','개찰을 나와서 바로 <mark>왼쪽</mark>으로','sjklya-6.jpg'],['stairsDown','階段を下りる','눈앞의 JR선 승강장 가는 <mark>계단으로 내려가기</mark>','sjklya-7.jpg'],['walk','そのまま直進','내려간 뒤 <b>돌지 말고</b> 그대로 직진','sjklya-8.jpg'],['walk','通路を25秒直進','통로를 <mark>약 25초</mark> 직진','sjklya-9.jpg'],['stairsUp','突き当たり階段↑','끝의 <mark>계단으로 올라가기</mark>','sjklya-10.jpg'],['rightFront','右斜め前へ','올라가자마자 <mark>오른쪽 앞</mark>으로','sjklya-11.jpg'],['walk','15番線案内板','오른쪽 앞으로 약 10초, 「<mark>15番線</mark>」 안내판이 보임','sjklya-12.jpg'],['stairsUp','15番線の階段','그대로 <mark>15番線</mark> 계단을 올라가기','sjklya-15.jpg'],['goal','到着！','야마노테선 <mark>15番線</mark>(이케부쿠로・타바타・우에노 방면) 도착!','sjcy-8.jpg']];
const B=[['start','乗車位置','도착 시 하차 전용 승강장 쪽 문이 먼저 열림. 8량 편성은 <mark>5호차 4번 문</mark>, 10량 편성은 <mark>7호차 4번 문</mark>','sjklya-16.jpg'],['stairsUp','1つ目の階段↑','하차 전용 승강장 바로 옆에 <mark>첫 번째 계단</mark>, 올라가기','sjklya-17.jpg'],['stairsUp','2つ目の階段↑','올라간 뒤 오른쪽 뒤편에 <mark>두 번째 계단</mark>, 이어서 올라가기','sjklya-18.jpg'],['walk','階段を上がった所','두 번째 계단을 다 올라온 곳','sjklya-19.jpg'],['gate','JR線 連絡口','눈앞이 「<mark>JR線 連絡口</mark>」 개찰구, 여기로 나가기','sjklya-20.jpg'],['left','左へ10秒','개찰을 나와 <mark>왼쪽</mark>으로 약 10초 걷기','sjklya-21.jpg'],...A.slice(6)];
const routes={A:{steps:A,duration:'2:10'},B:{steps:B,duration:'2:02'}};let r='A',i=0,x0=0,y0=0,t0=0;const $=s=>document.querySelector(s),stage=$('#stage');function draw(){let s=routes[r].steps[i],ic=I[s[0]],tot=routes[r].steps.length,goal=s[0]=='goal';stage.innerHTML=`<div class="photo"><img src="https://1rankup.jp/img/${s[3]}" alt=""><div class="count">${i+1} / ${tot}</div>${i==0?'<div class="start">START · 탑승</div>':''}${goal?'<div class="goal"><span class="chip" style="background:var(--jr)">JR</span> 야마노테선</div>':''}</div><div class="copy"><div class="icon" style="background:${ic[1]};color:${ic[2]}">${ic[0]}</div><div><div class="meta" style="color:${ic[2]}">${ic[3]}</div><div class="jp">${s[1]}</div><div class="ko">${s[2]}</div></div></div>`;$('#cur').textContent=i+1;$('#total').textContent=tot;$('#duration').textContent=routes[r].duration;$('#prog').style.width=(i+1)/tot*100+'%';$('#prev').disabled=i==0;$('#next').textContent=i==tot-1?'다시 시작':'다음 →'}function go(n){let tot=routes[r].steps.length;i=(n+tot)%tot;draw()}function route(n){r=n;i=0;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.route==r));$('#app').classList.toggle('routeB',r=='B');draw()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>route(b.dataset.route));$('#next').onclick=()=>go(i+1);$('#prev').onclick=()=>i&&go(i-1);$('#reset').onclick=()=>go(0);stage.ontouchstart=e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now()};stage.ontouchend=e=>{let dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Date.now()-t0<500&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)dx<0?go(i+1):i&&go(i-1)};document.onkeydown=e=>{if(e.key=='ArrowRight'||e.key==' ')go(i+1);if(e.key=='ArrowLeft'&&i)go(i-1)};[...A,...B].forEach(s=>{let im=new Image;im.src='https://1rankup.jp/img/'+s[3]});draw();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script></body></html>
